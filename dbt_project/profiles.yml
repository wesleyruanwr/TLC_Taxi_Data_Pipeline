ny_taxi_profile:
  target: dev
  outputs:
    dev:
      type: postgres
      host: postgres
      port: 5432
      user: "{{ env_var('POSTGRES_USER', 'postgres') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'postgres') }}"
      dbname: "{{ env_var('NY_TAXI_DB_NAME', 'ny_taxi') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
