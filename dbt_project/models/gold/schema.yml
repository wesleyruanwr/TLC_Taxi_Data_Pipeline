version: 2

sources:
  - name: silver
    schema: silver
    tables:
      - name: trips
        columns:
          - name: VendorID
            quote: true
            tests:
              - not_null
          - name: tpep_pickup_datetime
            tests:
              - not_null
          - name: tpep_dropoff_datetime
            tests:
              - not_null
          - name: trip_distance
            tests:
              - not_null
          - name: payment_type
            tests:
              - not_null
              - accepted_values:
                  values: [1, 2, 3, 4, 5, 6]
          - name: total_amount
            tests:
              - not_null
          - name: is_valid_trip
            tests:
              - not_null
              - accepted_values:
                  values: ['true', 'false']
      - name: payment_types
        columns:
          - name: payment_type
            tests:
              - unique
              - not_null
          - name: payment_description
            tests:
              - not_null
          - name: is_valid_payment
            tests:
              - not_null

models:
  - name: fct_trips
    description: "tabela com todas as corridas de tatadas contendo campos calculados de qualidade e duracão."
    columns:
      - name: vendor_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_vendors')
              field: vendor_id
      - name: rate_code_id
        tests:
          - relationships:
              to: ref('dim_rate_codes')
              field: rate_code_id
      - name: pickup_datetime
        tests:
          - not_null
      - name: trip_distance
        tests:
          - not_null
      - name: payment_type
        tests:
          - not_null
          - relationships:
              to: ref('dim_payment_types')
              field: payment_type
      - name: is_valid_trip
        tests:
          - not_null

  - name: dim_payment_types
    description: "tabela dimensao com os tipos de pagamento e se são considerados válidos"
    columns:
      - name: payment_type
        tests:
          - unique
          - not_null
      - name: payment_description
        tests:
          - not_null
      - name: is_valid_payment
        tests:
          - not_null

  - name: dim_vendors
    description: "Tabela dimensão com os provedores de tecnologia dos táxis."
    columns:
      - name: vendor_id
        tests:
          - unique
          - not_null
      - name: vendor_description
        tests:
          - not_null

  - name: dim_rate_codes
    description: "Tabela dimensão com os tipos de tarifa das corridas."
    columns:
      - name: rate_code_id
        tests:
          - unique
          - not_null
      - name: rate_code_description
        tests:
          - not_null

  - name: mv_monthly_indicators
    description: "View materializada com indicadores mensais agregados por total de corridas, valor total valido, ticket medio e distancia media."
    columns:
      - name: month_yyyymm
        tests:
          - not_null
      - name: vendor_id
        tests:
          - not_null
      - name: total_rides
        tests:
          - not_null
